<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>望潮 Aurum｜每日投资答案</title>
  <meta name="description" content="望潮 Aurum：每天先看今日结论，再看自己的持仓。覆盖美股投资、港股打新、聪明人持仓与A股收息。">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta name="theme-color" content="#F5F2EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="望潮 Aurum">
  <link rel="canonical" href="https://devi-y.github.io/aurumer/daily.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="望潮 Aurum">
  <meta property="og:title" content="望潮 Aurum｜每日投资答案">
  <meta property="og:description" content="30秒看清今日结论、持仓状态和下一步。">
  <meta property="og:url" content="https://devi-y.github.io/aurumer/daily.html">
  <meta property="og:image" content="https://devi-y.github.io/aurumer/assets/aurum-share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="望潮 Aurum｜每日投资答案">
  <meta name="twitter:description" content="少看行情噪音，每天先看结论。">
  <meta name="twitter:image" content="https://devi-y.github.io/aurumer/assets/aurum-share.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/aurum-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="望潮首页">望潮 <small>Aurum</small></a>
      <nav class="top-actions" aria-label="主导航">
        <a href="index.html#/us">完整工具</a>
      </nav>
    </header>

    <main>
      <section class="daily-head" aria-labelledby="hero-title">
        <div>
          <span class="eyebrow">DAILY ANSWERS</span>
          <h1 id="hero-title">今天先看五个答案</h1>
        </div>
        <div class="update-status" aria-live="polite">
          <span id="updated-at" class="updated-at">数据加载中</span>
          <span id="freshness-state" class="freshness-state">正在读取</span>
        </div>
      </section>

      <section class="section daily-answer-section" aria-labelledby="today-title">
        <div class="section-head">
          <div>
            <h2 id="today-title">今日策略状态</h2>
          </div>
          <a href="index.html#/us">打开完整研究 →</a>
        </div>
        <div id="daily-conclusions" class="conclusion-grid" aria-live="polite">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </section>

      <section class="section holdings-section" aria-labelledby="holdings-title">
        <div class="section-head">
          <div>
            <span class="eyebrow">MY PORTFOLIO</span>
            <h2 id="holdings-title">我的持仓</h2>
          </div>
          <button id="open-holding-form" class="text-button" type="button">＋ 添加持仓</button>
        </div>
        <p class="privacy-note">持仓数据只保存在当前浏览器，不上传服务器。</p>
        <div id="holdings-list" class="holdings-list" aria-live="polite"></div>
      </section>

    </main>

    <footer>
      <p>公开资料研究观察 · 页面时间和来源为准 · 不构成投资建议</p>
      <div class="footer-links"><a href="cockpit.html">方法说明</a><a href="index.html">完整工具</a></div>
    </footer>
  </div>

  <dialog id="holding-dialog" class="holding-dialog">
    <form id="holding-form" method="dialog">
      <div class="dialog-head">
        <div><span class="eyebrow">ADD HOLDING</span><h2>添加一只持仓</h2></div>
        <button id="close-holding-form" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <label>市场
        <select id="holding-market" required>
          <option value="US">美股</option>
          <option value="HK">港股</option>
          <option value="A">A股</option>
          <option value="GOLD">黄金</option>
        </select>
      </label>
      <label>标的代码
        <input id="holding-code" name="code" placeholder="例如 NVDA / 00700 / 600036；黄金可填 CNY 或 USD" autocomplete="off" required>
      </label>
      <div class="form-grid">
        <label>持仓成本
          <input id="holding-cost" name="cost" type="number" min="0" step="0.001" placeholder="有成本再填写（不填不算盈亏）">
        </label>
        <label>持仓数量（选填）
          <input id="holding-shares" name="shares" type="number" min="0" step="0.001" placeholder="用于计算盈亏">
        </label>
      </div>
      <p class="form-hint">成本可留空；未填写成本时只记录持仓，不计算浮盈或金额盈亏。数据只保存在当前浏览器。</p>
      <button class="submit-button" type="submit">保存持仓</button>
    </form>
  </dialog>

  <script src="assets/dashboard.js" defer></script>
</body>
</html>
